<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goal4</title>
  <style>
    body {
      background-color: #5c93e6;
      color: white;
      font-family: Georgia, serif;
      margin: 20px;
    }

    h1 {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .color-property {
      color: #e07a5f;
      font-size: 18px;
      margin-bottom: 60px;
    }

    .font-size-property {
      font-size: 64px;
      font-weight: normal;
      margin-bottom: 60px;
    }

    .font-weight-property {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .font-family-property {
      font-size: 18px;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-style: italic;
      margin-bottom: 40px;
    }

    .text-align-property {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>

  <h1>Important CSS Properties</h1>
  <p class="color-property">Color</p>
  <p class="font-size-property">Font Size</p>
  <p class="font-weight-property">Font Weight</p>
  <p class="font-family-property">Font Family</p>
  <p class="text-align-property">Text Align</p>

</body>
</html>
